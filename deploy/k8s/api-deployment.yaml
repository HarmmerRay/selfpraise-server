apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugme-api
  namespace: hugme
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hugme-api
  template:
    metadata:
      labels:
        app: hugme-api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: harmmeray/selfpraise-server:api-latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: hugme-secrets
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 5']
---
apiVersion: v1
kind: Service
metadata:
  name: hugme-api
  namespace: hugme
spec:
  selector:
    app: hugme-api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hugme-api-hpa
  namespace: hugme
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hugme-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
