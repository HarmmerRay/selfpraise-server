# LiteLLM Proxy — HugMe 多源 LLM 网关
# Nest 将 LLM_BASE_URL 指向 http://localhost:4000/v1，model=hugme-agnes
# Agnes 失败时自动 fallback 到 Kimi → GLM（需对应 API Key）

model_list:
  - model_name: hugme-agnes
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
  - model_name: hugme-kimi
    litellm_params:
      # Coding API 最新：k3（见 GET /coding/v1/models）
      model: openai/k3
      api_base: https://api.kimi.com/coding/v1
      api_key: os.environ/KIMI_API_KEY
  - model_name: hugme-glm
    litellm_params:
      # Coding Plan 最新：glm-5.2（见 GET /coding/paas/v4/models）
      model: openai/glm-5.2
      api_base: https://open.bigmodel.cn/api/coding/paas/v4
      api_key: os.environ/GLM_API_KEY

litellm_settings:
  num_retries: 1
  request_timeout: 120

router_settings:
  allowed_fails: 1
  cooldown_time: 60
  fallbacks:
    - hugme-agnes: [hugme-kimi, hugme-glm]
    - hugme-kimi: [hugme-glm]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Admin UI / spend logs 需要 DB（「Not connected to DB」即缺此项）
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
