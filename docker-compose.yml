version: '3.8'

services:
  # ===== 基础设施 =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: selfpraise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfpraise
      POSTGRES_PASSWORD: selfpraise_dev
      POSTGRES_DB: selfpraise
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selfpraise']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: selfpraise-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== 监控（本地完整栈必起，与 postgres/redis 一并 docker compose up -d） =====
  # Prometheus：http://localhost:9090  → scrape host.docker.internal:3000/metrics
  # Grafana：  http://localhost:3001  admin / admin（运营后台「请求监控」iframe）
  # 配置：deploy/prometheus/ 、deploy/grafana/
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: selfpraise-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.1
    container_name: selfpraise-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
      # 允许被运营后台 iframe 嵌入（默认会 X-Frame-Options: deny）
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/http-requests.json
      GF_SECURITY_COOKIE_SAMESITE: disabled

    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  # ===== LLM 网关（多源 fallback；Nest LLM_BASE_URL=http://localhost:4000/v1）=====
  # UI: http://localhost:4000/ui  master key = LITELLM_MASTER_KEY
  litellm:
    # 若 ghcr 拉取慢，可改用已缓存镜像或代理；见 README
    image: ghcr.io/berriai/litellm:main-stable
    container_name: selfpraise-litellm
    restart: unless-stopped
    profiles: ['llm']
    ports:
      - '4000:4000'
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    environment:
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-hugme-litellm}
      # Admin UI 必须连库；独立库名 litellm，与业务库隔离
      DATABASE_URL: postgresql://selfpraise:selfpraise_dev@postgres:5432/litellm
    command: ['--config', '/app/config.yaml', '--port', '4000', '--num_workers', '1']
    depends_on:
      postgres:
        condition: service_healthy

  # ===== 应用服务（生产部署用） =====
  # 使用方式：docker-compose --profile prod up -d
  api:
    profiles: ['prod']
    image: harmmeray/selfpraise-server:api-latest
    container_name: selfpraise-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://selfpraise:selfpraise_dev@postgres:5432/selfpraise
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
